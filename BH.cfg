// =============================================================================
// CHEAP UNIQUE/SET RING & AMULET HIDES
// =============================================================================
// These %NL% rules MUST sit ABOVE the unique/set dump that follows.
// BH uses first matching stop-rule. The dump names the same pieces with %MAP%
// and no FILTLVL, so if these hides lived in Section 11 they never fired.
//
// Intent: hide only jewelry worth under 80 essence. Players (2026-09-27): 80+ essence
// is worth seeing for auto-transmute. FILTLVL>1 = hide on filter 2 and 3.
// FILTLVL>2 = hide on aggressive (3) only. Filter 0 and 1 still show them.
//
// Key on UNI<id>/SET<id>, never <code> LVLREQ=<n>. BH does not read the required
// level from a ground-drop packet (RequiredLevelCondition returns true), so a
// LVLREQ line matches every unique of that base and hid SoJ, Mara's, etc.
//
// Stone of Jordan - always shown at every filter
ItemDisplay[UNI947]: %PURPLE%0 T2%MAP% %GOLD%%NAME%%TIER-2% {%dark_green%Essence: 500 }
ItemDisplay[UNI946]: %RED%0 T3%MAP% %GOLD%%NAME%%TIER-3% {%dark_green%Essence: 250 }
// Lorell's Stone (60 essence) - hide on aggressive
ItemDisplay[UNI954 FILTLVL>2]: %NL%
// Basic unique rings (30 essence, First Dawn 60) - hide on filter 2 and 3
ItemDisplay[(UNI925 || UNI958 || UNI928 || UNI971 || UNI943 || UNI1041 || UNI1035 || UNI951 || UNI1053) FILTLVL>1]: %NL%
// Basic unique amulets (30 essence) - hide on filter 2 and 3
ItemDisplay[(UNI908 || UNI887 || UNI916) FILTLVL>1]: %NL%
// Cheap set rings/amulets - hide on filter 2 and 3
ItemDisplay[SET50 FILTLVL>1]: %NL%
ItemDisplay[SET27 FILTLVL>1]: %NL%
ItemDisplay[SET51 FILTLVL>1]: %NL%
ItemDisplay[SET1 FILTLVL>1]: %NL%
ItemDisplay[SET9 FILTLVL>1]: %NL%
ItemDisplay[SET31 FILTLVL>1]: %NL%
ItemDisplay[SET20 FILTLVL>1]: %NL%


