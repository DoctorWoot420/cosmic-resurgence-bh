//Sanctum Amulets - class amulets %n0-%n7 only drop from the Sanctum of Despair boss and roll
//class-only affixes (MagicPrefix/MagicSuffix itype asor/abar/aama/adru/anec/aass/apal).
//The base code alone identifies them, so every quality shows at every filter.
ItemDisplay[(RARE || CRAFT) (%n0 || %n1 || %n2 || %n3 || %n4 || %n5 || %n6 || %n7)]: |%NAME% %RED%T3| %RED%0 %dot-0a%%border-20%%TIER-3% [L%ILVL%]
ItemDisplay[MAG (%n0 || %n1 || %n2 || %n3 || %n4 || %n5 || %n6 || %n7)]: |%RED%T3 %BLUE%Craft %PURPLE%%BASENAME%| %RED%0 %dot-0a%%border-20%%TIER-3% [L%ILVL%]
ItemDisplay[NMAG (%n0 || %n1 || %n2 || %n3 || %n4 || %n5 || %n6 || %n7)]: |%NAME% %RED%T3| %RED%0 %dot-0a%%border-20%%TIER-3% [L%ILVL%]
//Hallowed amulets - the Angelic prism TRANSFORM amul recipes (CubeMain "amul,rar"/"amul,crf" + cx4)
//rebase the amulet to au1-au5 keeping its mods and add item_hallowed (stat 249). A hallowed
//class amulet no longer matches the %n codes above, so key on the hallowed stat instead.
